name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@7fd3aefaab1ae14d063930c85b2d629280c36620 # v2
    secrets: inherit

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@7fd3aefaab1ae14d063930c85b2d629280c36620 # v2
    secrets: inherit
