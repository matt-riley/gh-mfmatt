name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@071c2c2bbe410f73126d3cefd0a0b6812b3565f6 # v2
    secrets: inherit

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@071c2c2bbe410f73126d3cefd0a0b6812b3565f6 # v2
    secrets: inherit
