name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@2aa90cd79663d10959d67faf89a3ecce29392f6a # v2
    secrets: inherit

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@2aa90cd79663d10959d67faf89a3ecce29392f6a # v2
    secrets: inherit
