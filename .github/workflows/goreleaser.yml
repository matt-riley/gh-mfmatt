name: GoReleaser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
